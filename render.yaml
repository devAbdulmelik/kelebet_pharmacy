services:
  - type: web
    name: kelebet-pharmacy-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: ./build.sh
    startCommand: gunicorn kelebet_pharmacy.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: kelebet-pharmacy-api.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://kelebet-pharmacy-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kelebet-pharmacy-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kelebet-pharmacy-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: ""
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123

  - type: web
    name: kelebet-pharmacy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kelebet-pharmacy-api.onrender.com/api

databases:
  - name: kelebet-pharmacy-db
    plan: free
    databaseName: kelebet_pharmacy
    user: kelebet_pharmacy_user
